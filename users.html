<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sales AganceOnline - Users Management. Manage team members and approvals.">
    <title>Users Management – Sales AganceOnline</title>
    <link rel="icon" type="image/jpeg" href="./logo.jpg">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/users.css">
</head>
<body>

<div class="app-layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="./logo.jpg" alt="Logo" class="sidebar-logo">
            <div class="sidebar-brand-text">Sales <span>AganceOnline</span></div>
        </div>
        <nav class="sidebar-nav">
            <span class="nav-section-label">Main</span>
            <a href="./index.html" class="nav-link"><span class="nav-icon">📊</span>Dashboard</a>
            <a href="./cars.html" class="nav-link"><span class="nav-icon">🚗</span>Cars Inventory</a>
            <a href="./cars-for-sale.html" class="nav-link"><span class="nav-icon">🏷️</span>Cars for Sale</a>
            <a href="./wanted.html" class="nav-link"><span class="nav-icon">🔍</span>Wanted Cars</a>
            <span class="nav-section-label">Management</span>
            <a href="./users.html" class="nav-link"><span class="nav-icon">👥</span>Users</a>
            <a href="./logs.html" class="nav-link" data-role="owner"><span class="nav-icon">📋</span>Logs</a>
            <span class="nav-section-label">Account</span>
            <a href="./profile.html" class="nav-link"><span class="nav-icon">👤</span>Profile</a>
            <a href="#" class="nav-link" id="logout-btn"><span class="nav-icon">🚪</span>Logout</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user" onclick="window.location.href='./profile.html'">
                <div class="user-avatar" id="user-avatar">?</div>
                <div class="user-info">
                    <div class="user-name" data-user-name>Loading...</div>
                    <div class="user-role" data-user-role>...</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="app-main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" id="sidebar-toggle">☰</button>
                <h2 class="topbar-title">Users Management</h2>
            </div>
            <div class="topbar-right">
                <span class="text-muted text-sm" id="results-count"></span>
            </div>
        </header>

        <div class="page-content">
            <!-- Stats pills -->
            <div class="users-stats" id="users-stats">
                <!-- Populated dynamically -->
            </div>

            <!-- Filter bar -->
            <div class="filter-bar">
                <div class="search-bar" style="max-width: 280px;">
                    <span class="search-bar-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Search name or email...">
                </div>
                <div class="filter-group">
                    <select class="form-control" id="filter-status" style="width:auto;">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="suspended">Suspended</option>
                    </select>
                    <select class="form-control" id="filter-role" style="width:auto;">
                        <option value="">All Roles</option>
                        <option value="owner">Owner</option>
                        <option value="sales">Sales</option>
                    </select>
                    <button class="btn btn-outline btn-sm" id="clear-filters">✕ Clear</button>
                </div>
            </div>

            <!-- Users Table -->
            <div class="table-wrapper">
                <table class="table" id="users-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Registered</th>
                            <th>Last Login</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr>
                            <td colspan="7" style="text-align:center;padding:40px;">
                                <div class="loader-spinner" style="width:28px;height:28px;border-width:2px;margin:0 auto;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Edit Role Modal -->
<div class="modal-overlay" id="edit-role-modal">
    <div class="modal" style="max-width:360px;">
        <div class="modal-header">
            <h2>Change Role</h2>
            <button class="btn btn-ghost btn-sm" data-close-modal="edit-role-modal">✕</button>
        </div>
        <div class="modal-body">
            <p class="text-muted" style="margin-bottom:16px;">Select the new role for <strong id="edit-role-user-name"></strong>:</p>
            <input type="hidden" id="edit-role-user-id">
            <div class="form-group">
                <label class="form-label">Role</label>
                <select id="edit-role-select" class="form-control">
                    <option value="sales">Sales</option>
                    <option value="owner">Owner</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" data-close-modal="edit-role-modal">Cancel</button>
            <button class="btn btn-primary" id="save-role-btn">Save Role</button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./config/supabase-config.js"></script>
<script src="./js/supabase-client.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/guards.js"></script>
<script src="./js/ui-helpers.js"></script>
<script src="./js/realtime.js"></script>
<script src="./js/users.js"></script>
</body>
</html>
